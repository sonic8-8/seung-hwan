# App 서버의 /etc/nginx/sites-available/seung-hwan.conf 에 두고 sites-enabled 에 링크한다.
# 인증서(--cert-name seung-hwan)를 먼저 발급해야 nginx -t 가 통과한다.

server {
    listen 80;
    listen [::]:80;

    server_name seung-hwan.com www.seung-hwan.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 301 https://seung-hwan.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name www.seung-hwan.com;

    ssl_certificate /etc/letsencrypt/live/seung-hwan/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seung-hwan/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    return 301 https://seung-hwan.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name seung-hwan.com;

    ssl_certificate /etc/letsencrypt/live/seung-hwan/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seung-hwan/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    location / {
        proxy_pass http://127.0.0.1:18084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
